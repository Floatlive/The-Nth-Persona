name: Attach source ZIP to Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  source-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build source ZIP
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python scripts/build_release.py --ref "$TAG" --output-dir dist
      - name: Attach source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/the-nth-persona-"$TAG".zip --clobber
